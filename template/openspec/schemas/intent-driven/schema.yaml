name: intent-driven
version: 1
description: Intent-driven OpenSpec workflow - proposal -> Gherkin-style specs -> design -> adr -> tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which behaviour specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose behaviour is changing. Only include if spec-level behaviour changes, not just implementation details. Each needs an OpenSpec Markdown delta file at `specs/<name>/spec.md`. Check `openspec/specs/` for existing spec names. Leave empty if no behaviour changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.


      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <repo>/openspec/adr/ by a later step after
      design.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.


      This is the foundation - specs, design, adr, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: OpenSpec Markdown specs with Gherkin-style behaviour scenarios
    template: spec.md
    instruction: >
      Create OpenSpec Markdown spec files that define WHAT the system should do.
      The Markdown structure is the OpenSpec merge wrapper; the requirement and
      scenario content inside that wrapper should be written in Gherkin style.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers exactly so OpenSpec archive can merge):

      - **ADDED Requirements**: New behaviour capabilities.

      - **MODIFIED Requirements**: Changed behaviour - MUST include the full
      updated requirement content, not a partial diff.

      - **REMOVED Requirements**: Deprecated behaviours - MUST include
      **Reason** and **Migration**.

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format.


      OpenSpec wrapper requirements:

      - Each requirement MUST use `### Requirement: <name>`.

      - Each scenario MUST use `#### Scenario: <name>`. This exact four-hash
      heading is required for OpenSpec validation and archive.

      - Every requirement MUST have at least one scenario.


      Gherkin-style content requirements:

      - Treat each requirement as the feature or business rule being specified.
      You may include `Feature:` or `Rule:` prose in the requirement body when
      it clarifies the behaviour.

      - Each scenario MUST describe behaviour with `GIVEN`, `WHEN`, and `THEN`
      steps. Use `AND` or `BUT` for follow-on steps.

      - Write observable outcomes in `THEN` steps. Avoid implementation details
      such as database table names, private methods, or UI selectors unless
      they are part of the domain contract.

      - Do not create `.feature` files for this artifact. External Gherkin
      linting is outside this schema; `spec.md` is required for OpenSpec merge.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md.

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios).

      3. Paste under `## MODIFIED Requirements` and edit it so the copied block
      represents the full desired behaviour after the change.

      4. Ensure header text matches exactly (whitespace-insensitive).


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time. If adding new concerns without changing existing behaviour,
      use ADDED instead.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Prior decisions (read existing ADRs first):

      Before writing, list every file in <repo>/openspec/adr/. Build the supersession
      graph from each ADR's Supersedes field - an ADR is no longer in force if
      a later ADR's Supersedes points at it. Only the currently-in-force ADRs
      (accepted, not superseded) constrain this design. Older superseded ADRs
      are historical context only and MUST NOT be treated as live commitments.
      New design choices MUST be coherent with the in-force set. If a current
      ADR needs to be revisited, do not propose modifying it; flag it under
      Open Questions and let the adr step record a new superseding ADR.


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] -> Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve.
      Include any in-force ADRs that this design suggests revisiting; the adr
      step will record the supersession.


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.


      **触发器**（命中任一条才需要写实质设计内容，其余情况跳过）：

      - 跨模块 / 新架构模式

      - 新外部依赖或显著的数据模型变更

      - 安全、性能或迁移复杂度


      未命中任何触发器时，design.md 全部内容就是一行**跳过声明**：`跳过：<未命中理由>`。
      不要在跳过声明之外再补充空洞的模板小节（Context/Goals/... 留空不写）。
    requires:
      - proposal
  - id: adr
    generates: "../../adr/*.md"
    description: Architecture Decision Records distilled from design for future reference
    template: adr.md
    instruction: >
      Distill significant decisions from design.md into Architecture Decision
      Records that live in <repo>/openspec/adr/ and persist across changes.
      The path <repo>/openspec/adr/ is a durable sibling of
      openspec/changes/ and openspec/specs/. ADR files MUST be written there
      and MUST NOT be written under openspec/changes/<change>/ (which gets
      archived per change). The openspec CLI never reads or touches
      openspec/adr/.


      IRON RULE - ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance, not its Status, not its body, not its
      date. To change a previously accepted decision, record a NEW ADR whose
      Status is "accepted, supersedes ADR-NNNN" and whose `Supersedes:` field
      names the prior one. Design consumers derive what is currently in force
      by walking Supersedes links across the folder. The prior ADR's contents
      stay frozen as a historical record.


      Process:

      1. Read every existing ADR in <repo>/openspec/adr/. Build the supersession graph
      from each ADR's Supersedes field. This tells you which prior ADRs are
      in force - you do NOT need the highest sequence number here, because new
      ADRs are not numbered on a branch (see step 3).

      2. Re-read design.md. Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) - not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one. If diverging, the new ADR supersedes the
      prior.

      3. For each qualifying decision, create a NEW file at
      <repo>/openspec/adr/DRAFT-kebab-title.md. Do NOT assign a sequence number
      on the branch: parallel branches that each pick "highest + 1" collide on
      the same number and conflict at merge time. The 4-digit sequence number is
      assigned only at merge time (see "Numbering at merge" below), by whoever
      lands the branch on main. Use the template (MADR-short); its title line
      stays "# DRAFT. <title>" until numbered. If this decision replaces a prior
      in-force ADR, set Status to "accepted, supersedes ADR-NNNN" and populate
      the `Supersedes:` field with the prior ADR's REAL number (it already lives
      on main and its number is stable) - only this new ADR's own number is
      deferred. Explain in Context why the prior decision is being revisited. Do
      NOT touch the prior ADR's file.

      4. If nothing meets the bar, do not invent ADRs. The step still completes
      as long as <repo>/openspec/adr/ already contains at least one ADR file
      (numbered or DRAFT).


      Filename convention: DRAFT-kebab-title.md on a branch; NNNN-kebab-title.md
      once numbered (e.g., 0042-use-postgres-for-catalog.md). Sequence is
      monotonic across the whole repo and never reused.


      Numbering at merge: before merging a branch's ADRs into main, whoever lands
      the branch must (a) re-scan main's openspec/adr/ for the current highest
      NNNN, (b) assign max+1, max+2 ... to each DRAFT in this change in order,
      (c) `git mv DRAFT-kebab-title.md NNNN-kebab-title.md` to preserve history,
      (d) change the title line "# DRAFT." to "# NNNN.", (e) back-fill any
      in-change reference to the draft (design.md pointers, a sibling ADR's
      Supersedes) with the real number, then (f) commit and merge. Each branch
      re-scans main independently, so a branch landing after another sees the
      just-assigned numbers and picks up where they left off - no collision.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist broken into small, independently-gated slices
    template: tasks.md
    instruction: >
      Create the task list as a small number of independently verifiable
      **slices** — not a flat checkbox list. This produces three artifacts
      plus one generated file:


      1. `slices.json` at the change root: `{gate: {...}, slices: [{id,
      title, packet, owns: [...], deps: [...], verify, scenarios: [...]},
      ...], scenario_tests: {"<capability>#<scenario-id>":
      "<test-file>::<test-func>"}}`. Each slice's `owns` is the list of file
      globs it exclusively writes; `deps` names slices it depends on;
      `verify` is a single runnable command that decides pass/fail for that
      slice alone.
      `gate.pytest`（可选）：G7 实跑 scenario 测试用的 pytest
      命令前缀（如 `uv run pytest`）；缺省从 `gate.test` 推导。
      `gate.test`（全量测试命令）**必填**，由 `slice-gate.py lint` 校验。
      pytest 的预存红由 baseline 记录到 `gate-baseline.json`，final 按基线逐条差分，
      只有新增的失败才算红，**无需手写 deselect**。
      `gate.checks`（可选）：仓库自定义的成对检查，数组，每项
      `{name, baseline, final, timeout_sec}`；baseline 运行 `baseline` 命令
      （为 null 时 baseline 不跑），final 运行 `final` 命令，判定只看退出码。
      `gate.checks_skip`（可选）：`{<name>: <理由>}`。openspec 根目录下有
      `gate-checks.json`（仓库默认检查）时，把其中每个检查抄进 `gate.checks`，
      或在 `gate.checks_skip` 写明理由；由 `slice-gate.py lint` 校验。
      `gate.impacted`（可选）：仓库已有选测命令时配上（非空字符串，由
      `slice-gate.py lint` 校验）；增量 final 改由它运行、不用内建选测，库经
      `GATE_DELTA_FILE`（改动清单文件，每行一个仓库相对路径）/
      `GATE_ANCHOR_COMMIT`（锚点 commit）交给它改动清单与锚点。
      测试分层：openspec 根目录下有 `test-tiers.json`（单元层 `unit` +
      集成区域 `regions`，由 `/test-tiers` 生成）时，`gate.test` 必须等于
      `unit.cmd`（基线就是单元层）；`gate.integration`（可选）是本 change
      要在 baseline / final 运行的区域名数组，`gate.integration_skip`（可选）
      是 `{<区域名>: <理由>}`；区域的 `covers` 与任一切片 `owns` 相交时，
      该区域必须选进 `gate.integration` 或在 `gate.integration_skip` 写明理由。
      写 scenario 骨架前先定层：默认单元层（纯函数、不碰真实文件 / 子进程 /
      网络、每个用例 <3 秒）；确需真实文件 / 子进程 / 网络才进集成区域，
      并选上该区域；骨架文件必须放在 `unit.paths` 或已选区域的 `paths` 里。
      以上都由 `slice-gate.py lint` 校验；没有 `test-tiers.json` 时不得写
      `gate.integration` / `gate.integration_skip`。
      部件形态（`test-tiers.json` 顶层是 `parts`，多语言 monorepo）下，
      `gate.test` 必须等于 `python3 .claude/hooks/test-tiers.py run unit`
      （驱动命令，逐部件跑单元层），不得写 `gate.impacted`；骨架文件须落在
      某部件的单元层或已选区域。


      2. `slices/<S>.md` — one packet per slice: what it does, the exact
      `owns` file paths, an interface summary of any slice it depends on, and
      its `verify` command.


      3. Scenario skeletons: for every scenario in the delta specs, add one
      `xfail(strict=True)` (or the language-equivalent strict-xfail) test
      function in the test file owned by the slice that implements it. Write
      the Given/When/Then comment block first, then real assertions (not
      `pass`) — the executing slice removes the `xfail` mark to "unlock" the
      scenario.


      4. `tasks.md` is **generated from `slices.json`**, not hand-written:
      one checkbox line per slice, `- [ ] S<n> <title>`, each line carrying
      `deps:` and `verify:` suffixes (see `templates/tasks.md` for the exact
      format).


      **Slicing rules**（由 `slice-gate.py lint` 校验；1–9 片、DAG 深度 ≤ 3、同 wave
      owns 不相交、每片 owns ≤ 12 条、每片 verify 非空）:

      - 1–9 slices total.

      - The `deps` graph is acyclic; DAG depth ≤ 3 (Kahn-layer count).

      - Within the same wave (topological layer), no two slices' `owns` globs
      may overlap.

      - Each slice's `owns` has at most 12 entries.

      - Every slice has a non-empty `verify` command.

      - `verify` runs tests only — it must not contain typecheck / lint tools
      (`tsc` / `typecheck` / `eslint` / `rustfmt` / `clippy` / `ruff` /
      `mypy` / `flake8` / `golangci`). Put typecheck in `gate.typecheck` and
      lint in `gate.lint`; the gate diffs them against the baseline so
      pre-existing errors are excluded (checked by `slice-gate.py lint`).


      After writing `slices.json`, run
      `python3 .claude/hooks/slice-gate.py lint --change-dir <dir>` and fix
      `slices.json` until it passes before generating `tasks.md` from it.


      **IMPORTANT**: The apply phase parses `slices.json` and the generated
      `tasks.md` checkbox format to track progress; tasks not represented
      there won't be tracked.


      Reference specs for what to build, design for how to build it, and
      <repo>/openspec/adr/ for durable architectural commitments to honor.

      Each slice should be independently verifiable via its own `verify`
      command.
    requires:
      - specs
      - adr
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
